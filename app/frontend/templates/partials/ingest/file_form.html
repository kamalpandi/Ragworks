<article class="fade-in">
  <header><strong>Upload Document</strong></header>
  <form
    id="ingest-file-form"
    hx-post="/ui/ingest/file"
    hx-encoding="multipart/form-data"
    hx-target="#file-result"
    data-max-mb="{{ max_upload_mb }}"
  >
    <label for="file">PDF or TXT File</label>
    <input type="file" id="file" name="file" accept=".pdf,.txt" required />
    <small>Maximum size: {{ max_upload_mb }} MB</small>
    <button type="submit">Process File</button>
  </form>
  <div id="file-result" style="margin-top: 1rem; font-weight: bold"></div>
  <script>
    (function () {
      var form = document.getElementById("ingest-file-form");
      if (!form) return;
      form.addEventListener(
        "submit",
        function (e) {
          var maxMb = parseFloat(form.getAttribute("data-max-mb")) || 0;
          var input = form.querySelector('input[type="file"]');
          if (input && input.files && input.files[0] && maxMb > 0) {
            if (input.files[0].size > maxMb * 1024 * 1024) {
              e.preventDefault();
              e.stopImmediatePropagation();
              var out = document.getElementById("file-result");
              out.innerHTML =
                "<span style='color: var(--pico-del-color);'>File too large. Maximum size is " +
                maxMb +
                " MB.</span>";
            }
          }
        },
        true,
      );
    })();
  </script>
</article>
