<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>RAG Framework - Login</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-container {
        max-width: 480px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main class="container login-container">
      <article>
        <header>
          <h1>RAG Engine</h1>
          <p>Enter your API key to access the dashboard.</p>
        </header>

        {% if error %}
        <p style="color: var(--pico-del-color);">{{ error }}</p>
        {% endif %}

        <form method="post" action="/login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="next" value="{{ next }}" />
          <label for="api_key">API Key</label>
          <input
            type="password"
            id="api_key"
            name="api_key"
            placeholder="rag-..."
            autocomplete="off"
            required
            autofocus
          />
          <button type="submit">Login</button>
        </form>

        <footer>
          <small>
            Don't have an API key? Ask your administrator to create one via the
            <code>POST /api/v1/admin/api-keys</code> endpoint.
          </small>
        </footer>
      </article>
    </main>
  </body>
</html>
