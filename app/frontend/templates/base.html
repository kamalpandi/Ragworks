<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token | default('') }}" />
    <title>RAG Framework</title>
    <script src="/static/js/htmx.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body>
    <main class="container">
      <nav>
        <ul>
          <li><strong>RAG Engine</strong></li>
        </ul>
        <ul>
          <li><a href="/">Dashboard</a></li>
          <li><a href="/config">Configuration</a></li>
          <li><a href="/ingest">Ingestion</a></li>
          <li><a href="/query">Chat / Query</a></li>
          <li><a href="/logs">Logs</a></li>
          <li><a href="/eval">Evaluation</a></li>
          <li><a href="/prompts">Prompts</a></li>
          <li><a href="#" id="logout-link" onclick="logout()">Logout</a></li>
        </ul>
      </nav>

      <hr />

      {% block content %}{% endblock %}
    </main>

    <script>
      function logout() {
        var meta = document.querySelector('meta[name="csrf-token"]');
        var form = document.createElement("form");
        form.method = "post";
        form.action = "/logout";
        if (meta && meta.content) {
          var token = document.createElement("input");
          token.type = "hidden";
          token.name = "csrf_token";
          token.value = meta.content;
          form.appendChild(token);
        }
        document.body.appendChild(form);
        form.submit();
      }

      document.addEventListener("htmx:configRequest", function (event) {
        var verb = (event.detail.verb || "").toLowerCase();
        if (verb && verb !== "get") {
          var meta = document.querySelector('meta[name="csrf-token"]');
          if (meta && meta.content) {
            event.detail.headers["X-CSRF-Token"] = meta.content;
          }
        }
      });
    </script>
  </body>
</html>
