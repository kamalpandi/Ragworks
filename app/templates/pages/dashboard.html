{% extends "base.html" %} {% block content %}
<main class="container">
  <hgroup>
    <h1>RAG Engine</h1>
    <p>System status and activity overview</p>
  </hgroup>

  <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
    <button class="secondary outline"
      hx-get="/ui/dashboard/status"
      hx-target="#status-cards"
      hx-swap="innerHTML"
      style="font-size: 0.8rem; margin-right: 0.5rem;">↻ Status</button>
    <button class="secondary outline"
      hx-get="/ui/dashboard/stats"
      hx-target="#usage-stats"
      hx-swap="innerHTML"
      style="font-size: 0.8rem; margin-right: 0.5rem;">↻ Stats</button>
    <button class="secondary outline"
      hx-get="/ui/dashboard/activity"
      hx-target="#recent-activity"
      hx-swap="innerHTML"
      style="font-size: 0.8rem; margin-right: 0.5rem;">↻ Logs</button>
    <button class="secondary outline"
      hx-get="/ui/dashboard/docs"
      hx-target="#ingested-docs"
      hx-swap="innerHTML"
      style="font-size: 0.8rem;">↻ Docs</button>
  </div>

  <div id="status-cards" hx-get="/ui/dashboard/status" hx-trigger="load">
    <p>Loading status...</p>
  </div>

  <div id="usage-stats" hx-get="/ui/dashboard/stats" hx-trigger="load" style="margin-top: 1rem;">
    <p>Loading statistics...</p>
  </div>

  <div id="ingested-docs" hx-get="/ui/dashboard/docs" hx-trigger="load" style="margin-top: 1rem;">
    <p>Loading documents...</p>
  </div>

  <div id="recent-activity" hx-get="/ui/dashboard/activity" hx-trigger="load" style="margin-top: 1rem;">
    <p>Loading activity...</p>
  </div>
</main>
{% endblock %}
