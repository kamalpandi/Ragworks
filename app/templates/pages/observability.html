{% extends "base.html" %} {% block content %}
<main class="container">
  <hgroup>
    <h1>Log Viewer</h1>
    <p>Structured logging with filtering and search</p>
  </hgroup>

  <article id="log-stats" hx-get="/ui/logs/stats" hx-trigger="load, every 10s">
    <p>Loading stats...</p>
  </article>

  <article>
    <header>Filter Logs</header>
    <form
      hx-get="/ui/logs/list"
      hx-target="#log-entries"
      hx-trigger="submit, change from:#log-level, change from:#log-search"
    >
      <div style="display: flex; gap: 1rem">
        <select id="log-level" name="level">
          <option value="">All Levels</option>
          <option value="DEBUG">DEBUG</option>
          <option value="INFO">INFO</option>
          <option value="WARNING">WARNING</option>
          <option value="ERROR">ERROR</option>
        </select>
        <input
          id="log-search"
          name="search"
          type="search"
          placeholder="Search logs..."
          style="flex: 1"
        />
        <button type="submit">Refresh</button>
      </div>
    </form>
  </article>

  <div id="log-entries" hx-get="/ui/logs/list" hx-trigger="load">
    <p>Loading logs...</p>
  </div>
</main>
{% endblock %}
