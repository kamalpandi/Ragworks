[project]
name = "rag-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.7",
    "beautifulsoup4>=4.14.3",
    "datasets>=4.5.0",
    "fastapi>=0.128.2",
    "jinja2>=3.1.6",
    "langchain-community>=0.4.1",
    "langchain-experimental>=0.4.1",
    "langchain-text-splitters>=1.1.0",
    "llama-cpp-python>=0.3.16",
    "openai>=2.17.0",
    "pdfplumber>=0.11.9",
    "pgvector>=0.4.2",
    "pinecone[grpc]>=8.0.0",
    "psycopg[binary]>=3.3.2",
    "psycopg-pool>=3.2.6",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.6.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.40.0",
    "babel>=2.18.0",
    # Observability & Tracing
    "structlog>=24.4.0",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
    "opentelemetry-instrumentation-fastapi>=0.52.0",
    "prometheus-client>=0.21.0",
    # Reranker
    "flashrank>=0.2.8",
    # Evaluation
    "ragas>=0.3.0",
    "rouge-score>=0.1.2",
    "httpx>=0.28.1",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.ruff]
extend-exclude = ["scripts/emails/test_data"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency/parameter idioms: Depends/File/Query in defaults (B008)
# and deliberate re-raises in handlers (B904).
"app/api/**" = ["B008", "B904"]
# Frontend views are also FastAPI endpoints (same dependency idioms).
"app/frontend/**" = ["B008", "B904"]
# The eval background job intentionally records any failure on the job.
"app/api/v1/endpoints/eval.py" = ["BLE001"]
# Legacy HTMX UI layer, replaced by app/frontend and deleted in Phase 4.
"app/ui/**" = ["B008", "BLE001", "S110", "SIM117"]
# Standalone demo/consumer scripts, not application runtime.
"scripts/**" = ["ISC004", "ASYNC230", "ASYNC251"]
# Best-effort resilience boundaries: telemetry, metrics, and provider calls
# intentionally catch broadly so failures never break the request path.
"app/observability/log_store.py" = ["BLE001"]
"app/observability/logger.py" = ["BLE001", "S110"]
"app/services/usage_tracker.py" = ["BLE001"]
"app/services/llm_queue.py" = ["BLE001"]
"app/components/llms/llamacpp_llm.py" = ["BLE001"]
"app/components/loaders/web_loader.py" = ["BLE001"]
"app/evaluation/metrics/**" = ["BLE001"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
